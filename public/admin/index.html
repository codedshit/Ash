<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Dashboard</title>
<style>
    :root{
        --bg:#0A0B12; --panel:#12131c; --line:rgba(255,255,255,.1);
        --violet:#5B2A9E; --violet-strong:#7C4DCE; --ink:#ECEDF6; --ink-soft:#A9ABC0;
    }
    *{ box-sizing:border-box; }
    body{
        margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
        display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
        width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line);
        border-radius:18px; padding:28px; box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    }
    h1{ font-size:19px; margin:0 0 4px; }
    p.sub{ color:var(--ink-soft); font-size:13px; margin:0 0 20px; }
    label{ display:block; font-size:12.5px; color:var(--ink-soft); margin:14px 0 6px; }
    input[type=text], input[type=password], input[type=number], input[type=url], textarea, select{
        width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
        background:#0d0e17; color:var(--ink); font-size:14px; font-family:inherit;
    }
    input[type=color]{ width:44px; height:34px; border:none; background:none; padding:0; vertical-align:middle; }
    textarea{ resize:vertical; min-height:80px; }
    .row{ display:flex; gap:10px; align-items:center; }
    .row > div{ flex:1; }
    button{
        margin-top:16px; width:100%; padding:11px; border-radius:10px; border:none; cursor:pointer;
        background:linear-gradient(120deg,var(--violet),var(--violet-strong)); color:#fff;
        font-weight:600; font-size:14px;
    }
    button.secondary{ background:rgba(255,255,255,.06); color:var(--ink); }
    button:disabled{ opacity:.5; cursor:default; }
    .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .tabs button{ margin:0; flex:1; padding:9px; font-size:12.5px; background:rgba(255,255,255,.05); }
    .tabs button.active{ background:linear-gradient(120deg,var(--violet),var(--violet-strong)); }
    .section{ display:none; }
    .section.active{ display:block; }
    .msg{ font-size:13px; margin-top:10px; min-height:18px; }
    .msg.ok{ color:#8fd8a0; }
    .msg.err{ color:#e0748c; }
    .song-row{
        display:flex; justify-content:space-between; align-items:center;
        padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-top:8px; font-size:13px;
    }
    .song-row button{ margin:0; width:auto; padding:6px 10px; font-size:12px; background:rgba(224,116,140,.15); color:#e0748c; }
    #logoutBtn{ background:rgba(255,255,255,.06); color:var(--ink-soft); margin-top:24px; }
    hr{ border:none; border-top:1px solid var(--line); margin:20px 0; }
</style>
</head>
<body>

<div class="card" id="loginCard">
    <h1>Site Dashboard</h1>
    <p class="sub">Enter your password to continue.</p>
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button id="loginBtn">Log in</button>
    <div class="msg" id="loginMsg"></div>
</div>

<div class="card" id="dashCard" style="display:none; max-width:640px;">
    <h1>Site Dashboard</h1>
    <p class="sub">Changes go live in a minute or two after saving.</p>

    <div class="tabs">
        <button data-tab="theme" class="active">Theme</button>
        <button data-tab="video">BG Video</button>
        <button data-tab="identity">Identity</button>
        <button data-tab="songs">Songs</button>
        <button data-tab="badges">Badges</button>
        <button data-tab="extras">Extras</button>
    </div>

    <!-- THEME -->
    <div class="section active" id="tab-theme">
        <div class="row">
            <div><label>Main accent (violet)</label>
                <div class="row"><input type="color" id="violet"><input type="text" id="violetHex"></div>
            </div>
            <div><label>Main accent — light shade</label>
                <div class="row"><input type="color" id="violetStrong"><input type="text" id="violetStrongHex"></div>
            </div>
        </div>
        <div class="row">
            <div><label>Secondary accent (rose)</label>
                <div class="row"><input type="color" id="rose"><input type="text" id="roseHex"></div>
            </div>
            <div><label>Secondary accent — light shade</label>
                <div class="row"><input type="color" id="roseStrong"><input type="text" id="roseStrongHex"></div>
            </div>
        </div>
        <button onclick="saveTheme()">Save theme</button>
        <div class="msg" id="themeMsg"></div>
    </div>

    <!-- BG VIDEO -->
    <div class="section" id="tab-video">
        <label>Video URL (leave blank to remove)</label>
        <input type="url" id="videoUrl" placeholder="https://... or videos/bg.mp4">
        <label>Opacity (0–1)</label>
        <input type="number" id="videoOpacity" min="0" max="1" step="0.05" value="0.55">
        <button onclick="saveVideo()">Save background video</button>
        <div class="msg" id="videoMsg"></div>
    </div>

    <!-- IDENTITY -->
    <div class="section" id="tab-identity">
        <label>Display name</label>
        <input type="text" id="idName" placeholder="Ash">
        <label>Taglines (one per line — leave empty to use the site's built-in defaults)</label>
        <textarea id="idTaglines" placeholder="line one&#10;line two"></textarea>
        <label>Avatar image URL (leave blank to keep current)</label>
        <input type="url" id="idAvatar" placeholder="https://...">
        <label>Avatar frame</label>
        <select id="idFrame">
            <option value="none">None</option>
            <option value="gold">Gold ring (premium)</option>
            <option value="holo">Holo ring</option>
        </select>
        <button onclick="saveIdentity()">Save identity</button>
        <div class="msg" id="identityMsg"></div>
    </div>

    <!-- SONGS -->
    <div class="section" id="tab-songs">
        <div id="songList"></div>
        <hr>
        <label>Title</label>
        <input type="text" id="songTitle">
        <label>Artist</label>
        <input type="text" id="songArtist">
        <label>Cloudinary audio public ID</label>
        <input type="text" id="songId" placeholder="e.g. my_track_abc123">
        <label>Cloudinary cover image public ID (optional)</label>
        <input type="text" id="songCover">
        <button onclick="addSong()">Add song</button>
        <div class="msg" id="songsMsg"></div>
    </div>

    <!-- BADGES -->
    <div class="section" id="tab-badges">
        <div id="badgeList"></div>
        <hr>
        <label>Emoji / icon</label>
        <input type="text" id="badgeIcon" placeholder="👑" maxlength="4">
        <label>Label</label>
        <input type="text" id="badgeLabel" placeholder="Premium">
        <label>Color (hex, optional)</label>
        <div class="row"><input type="color" id="badgeColor" value="#FFD700"><input type="text" id="badgeColorHex" value="#FFD700"></div>
        <button onclick="addBadge()">Add badge</button>
        <div class="msg" id="badgesMsg"></div>
    </div>

    <!-- EXTRAS: discord + effects -->
    <div class="section" id="tab-extras">
        <label>Discord user ID (for live status widget)</label>
        <input type="text" id="discordUserId" placeholder="123456789012345678">
        <p class="sub" style="margin:6px 0 0;">Requires your Discord account to be in the
            <a href="https://discord.gg/lanyard" target="_blank" style="color:var(--violet-strong);">Lanyard</a>
            server to work — that's what powers the live status.</p>
        <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
            <input type="checkbox" id="discordEnabled" style="width:auto;"> Enable live Discord status widget
        </label>
        <hr>
        <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="fxScrollReveal" style="width:auto;"> Scroll reveal animations
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="fxViewCounter" style="width:auto;"> View counter
        </label>
        <button onclick="saveExtras()">Save extras</button>
        <div class="msg" id="extrasMsg"></div>
    </div>

    <button id="logoutBtn" onclick="logout()">Log out</button>
</div>

<script>
let currentConfig = null;

// ---- login ----
document.getElementById('loginBtn').onclick = async () => {
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = ''; msg.className = 'msg';
    try {
        const res = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Login failed'); }
        showDashboard();
    } catch (e) {
        msg.textContent = e.message; msg.className = 'msg err';
    }
};
document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    document.getElementById('dashCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
}

// ---- tabs ----
document.querySelectorAll('.tabs button').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    };
});

// ---- load + show ----
async function showDashboard() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dashCard').style.display = 'block';
    const res = await fetch('/api/config');
    if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        alert('Config Error: ' + (err.error || 'Failed to load'));
        return;
    }
    currentConfig = await res.json();
    populate();
}
    
function populate() {
    const t = currentConfig.theme || {};
    setColor('violet', t.violet || '#5B2A9E');
    setColor('violetStrong', t.violetStrong || '#7C4DCE');
    setColor('rose', t.rose || '#2E1854');
    setColor('roseStrong', t.roseStrong || '#402070');

    const bg = currentConfig.backgroundVideo || {};
    document.getElementById('videoUrl').value = bg.src || '';
    document.getElementById('videoOpacity').value = (typeof bg.opacity === 'number') ? bg.opacity : 0.55;

    const id = currentConfig.identity || {};
    document.getElementById('idName').value = id.name || '';
    document.getElementById('idTaglines').value = (id.taglines || []).join('\n');
    document.getElementById('idAvatar').value = id.avatar || '';
    document.getElementById('idFrame').value = id.frame || 'none';

    const discord = currentConfig.discord || {};
    document.getElementById('discordUserId').value = discord.userId || '';
    document.getElementById('discordEnabled').checked = !!discord.enabled;

    const fx = currentConfig.effects || {};
    document.getElementById('fxScrollReveal').checked = fx.scrollReveal !== false;
    document.getElementById('fxViewCounter').checked = fx.viewCounter !== false;

    renderSongs();
    renderBadges();
}

function setColor(prefix, hex) {
    document.getElementById(prefix).value = hex;
    document.getElementById(prefix + 'Hex').value = hex;
}
['violet','violetStrong','rose','roseStrong','badge'].forEach(p => {
    document.getElementById(p).addEventListener('input', e => document.getElementById(p+'Hex').value = e.target.value);
    document.getElementById(p+'Hex').addEventListener('input', e => {
        if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) document.getElementById(p).value = e.target.value;
    });
});

function renderBadges() {
    const wrap = document.getElementById('badgeList');
    const badges = currentConfig.badges || [];
    wrap.innerHTML = badges.length ? badges.map((b, i) => `
        <div class="song-row">
            <span>${escapeHtml(b.icon || '✦')} ${escapeHtml(b.label || '')}</span>
            <button onclick="removeBadge(${i})">Remove</button>
        </div>
    `).join('') : '<p class="sub">No badges yet.</p>';
}

function renderSongs() {
    const wrap = document.getElementById('songList');
    const songs = currentConfig.songs || [];
    wrap.innerHTML = songs.length ? songs.map((s, i) => `
        <div class="song-row">
            <span>${escapeHtml(s.title)} — ${escapeHtml(s.artist)}</span>
            <button onclick="removeSong(${i})">Remove</button>
        </div>
    `).join('') : '<p class="sub">No songs yet.</p>';
}
function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- save handlers ----
async function saveSection(section, data, msgId) {
    const msg = document.getElementById(msgId);
    msg.textContent = 'Saving...'; msg.className = 'msg';
    try {
        const res = await fetch('/api/config', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ section, data })
        });
        const updated = await res.json();
        if (!res.ok) throw new Error(updated.error || 'Save failed');
        currentConfig = updated;
        msg.textContent = 'Saved. Site updates in a minute or two.'; msg.className = 'msg ok';
        renderSongs();
        renderBadges();
    } catch (e) {
        msg.textContent = e.message; msg.className = 'msg err';
    }
}

function saveTheme() {
    saveSection('theme', {
        violet: document.getElementById('violetHex').value,
        violetStrong: document.getElementById('violetStrongHex').value,
        rose: document.getElementById('roseHex').value,
        roseStrong: document.getElementById('roseStrongHex').value,
    }, 'themeMsg');
}

function saveVideo() {
    saveSection('backgroundVideo', {
        src: document.getElementById('videoUrl').value.trim(),
        opacity: parseFloat(document.getElementById('videoOpacity').value) || 0.55,
    }, 'videoMsg');
}

function saveIdentity() {
    const taglines = document.getElementById('idTaglines').value
        .split('\n').map(s => s.trim()).filter(Boolean);
    saveSection('identity', {
        name: document.getElementById('idName').value.trim(),
        taglines,
        avatar: document.getElementById('idAvatar').value.trim(),
    }, 'identityMsg');
}

function addSong() {
    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('songArtist').value.trim();
    const id = document.getElementById('songId').value.trim();
    const cover = document.getElementById('songCover').value.trim();
    if (!title || !artist || !id) {
        const msg = document.getElementById('songsMsg');
        msg.textContent = 'Title, artist, and Cloudinary ID are required.'; msg.className = 'msg err';
        return;
    }
    const songs = [...(currentConfig.songs || []), { title, artist, id, cover }];
    saveSection('songs', songs, 'songsMsg').then(() => {
        document.getElementById('songTitle').value = '';
        document.getElementById('songArtist').value = '';
        document.getElementById('songId').value = '';
        document.getElementById('songCover').value = '';
    });
}

function removeSong(index) {
    const songs = (currentConfig.songs || []).filter((_, i) => i !== index);
    saveSection('songs', songs, 'songsMsg');
}

function addBadge() {
    const icon = document.getElementById('badgeIcon').value.trim() || '✦';
    const label = document.getElementById('badgeLabel').value.trim();
    const color = document.getElementById('badgeColorHex').value.trim();
    if (!label) {
        const msg = document.getElementById('badgesMsg');
        msg.textContent = 'Label is required.'; msg.className = 'msg err';
        return;
    }
    const badges = [...(currentConfig.badges || []), { icon, label, color }];
    saveSection('badges', badges, 'badgesMsg').then(() => {
        document.getElementById('badgeIcon').value = '';
        document.getElementById('badgeLabel').value = '';
    });
}

function removeBadge(index) {
    const badges = (currentConfig.badges || []).filter((_, i) => i !== index);
    saveSection('badges', badges, 'badgesMsg');
}

async function saveExtras() {
    const msg = document.getElementById('extrasMsg');
    msg.textContent = 'Saving...'; msg.className = 'msg';
    try {
        await saveSection('discord', {
            userId: document.getElementById('discordUserId').value.trim(),
            enabled: document.getElementById('discordEnabled').checked,
        }, 'extrasMsg');
        await saveSection('effects', {
            scrollReveal: document.getElementById('fxScrollReveal').checked,
            viewCounter: document.getElementById('fxViewCounter').checked,
        }, 'extrasMsg');
        msg.textContent = 'Saved. Site updates in a minute or two.'; msg.className = 'msg ok';
    } catch (e) {
        msg.textContent = e.message; msg.className = 'msg err';
    }
}

// try to resume an existing session on load
(async () => {
    const res = await fetch('/api/config');
    if (res.ok) { currentConfig = await res.json(); showDashboard(); }
})();
</script>
</body>
</html>
